name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --extra dev --frozen
      - name: Lint with Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Run Pytest
        run: uv run pytest
      - name: Run Smoke Test
        run: uv run fmcd smoke
