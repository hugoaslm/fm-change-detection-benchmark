dataset:
  name: "synthetic"
  root: "outputs/synthetic_dataset"
  num_scenes: 3
  tiles_per_scene: 2
  tile_size: 64
  input_size: 64
  seed: 42

encoder:
  name: "mock_encoder"
  checkpoint: "none"
  layers: ["layer1", "layer2"]

scoring:
  method: "cosine"  # cosine | standardized_euclidean

thresholds:
  methods: ["unlabeled", "calibrated"]

bootstrap:
  num_resamples: 50
  confidence_level: 0.95
  seed: 42

runtime:
  device: "cpu"
  cache_dtype: "float32"

output_dir: "outputs/smoke_results"
cache_dir: "outputs/cache"
