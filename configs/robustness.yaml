dataset:
  name: "levir_cd"
  root: "data/raw/LEVIR-CD"
  tile_size: 256
  input_size: 252
  seed: 42

encoders:
  - name: "rgb_pixels"
    checkpoint: "none"
    layers: ["input"]
  - name: "resnet50_imagenet"
    checkpoint: "DEFAULT"
    layers: ["layer4"]
  - name: "resnet50_s2_moco"
    checkpoint: "torchgeo_ssl4eo_s12_rgb_moco_efd9723"
    layers: ["layer4"]
  - name: "dinov2_vits14"
    checkpoint: "vit_small_patch14_dinov2.lvd142m"
    layers: ["block9"]

scoring:
  method: "cosine"

perturbations:
  - name: "brightness"
    values: [-0.15, 0.15]
  - name: "contrast"
    values: [0.8, 1.2]
  - name: "gaussian_noise"
    values: [0.03]
  - name: "gaussian_blur"
    values: [1.0]
  - name: "translation"
    values: [2, 4]
  - name: "saturation"
    values: [-0.20, 0.20]

bootstrap:
  num_resamples: 1000
  confidence_level: 0.95
  seed: 42

runtime:
  device: "auto"
  max_train_samples: null
  max_val_samples: null
  max_test_samples: null
  cache_dtype: "float16"

output_dir: "outputs/results_robustness"
cache_dir: "outputs/cache"
