[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fm-change-detection-benchmark"
version = "0.1.0"
description = "Foundation Model Change Detection Benchmark (v0.1)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "FM Change Detection Benchmark Contributors" }
]
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "timm>=0.9.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.2.0",
    "matplotlib>=3.7.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.3.0",
    "ruff>=0.1.0",
    "pre-commit>=3.3.0",
]

[project.scripts]
fmcd = "fm_change_detection.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
